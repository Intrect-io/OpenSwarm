<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenSwarm · Chat room</title>
  <script src="/static/js/themeBoot.js"></script>
  <script src="/static/js/webToken.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/shell.css" />
  <link rel="stylesheet" href="/static/css/chat.css" />
</head>
<body class="page-chat">
  <header class="topbar" data-shell>
  </header>

  <main class="chat-main">
    <div class="room-wrap">
      <div id="room" class="room" aria-label="Agent chat room"><div class="empty">Loading the room…</div></div>
      <div id="drop-overlay" class="drop-overlay" hidden>Drop to attach</div>
      <button type="button" id="scroll-latest" class="scroll-latest" hidden>↓ Latest</button>
      <div id="room-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>

    <form class="composer" id="composer" aria-label="Message the agents">
      <div id="composer-files" class="composer-files" aria-label="Attached files"></div>
      <div class="composer-row">
        <input id="composer-file" type="file" multiple hidden aria-hidden="true" />
        <button type="button" id="composer-attach" class="btn btn-ghost btn-icon" aria-label="Attach files" title="Attach files"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></button>
        <textarea id="composer-text" class="textarea composer-text" rows="1" autocomplete="off" placeholder="Loading…" aria-label="Message the agents"></textarea>
        <button type="submit" id="composer-send" class="btn btn-primary" disabled>Send</button>
      </div>
      <div id="composer-status" class="status-line composer-status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script type="module">
    import { startChatView } from '/static/js/chatView.mjs';
    import { mountShell } from '/static/js/shell.mjs';
    mountShell(document);
    startChatView(document);
  </script>
</body>
</html>
