<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenSwarm · Warehouse</title>
  <script src="/static/js/themeBoot.js"></script>
  <script src="/static/js/webToken.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/shell.css" />
  <link rel="stylesheet" href="/static/css/warehouse.css" />
</head>
<body class="page-warehouse">
  <header class="topbar" data-shell>
  </header>

  <main class="warehouse-main">
    <section class="browser" aria-label="Warehouse files">
      <div class="toolbar">
        <button id="up" type="button" class="btn btn-secondary btn-sm">Parent folder</button>
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Current path"></nav>
        <button id="refresh" type="button" class="btn btn-secondary btn-sm">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Modified</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="entries"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

    <aside class="upload" aria-label="Upload">
      <h2>Upload a file</h2>
      <p>Into folder <code id="upload-directory">/</code></p>
      <label class="dropzone" for="file">
        <span id="file-label">Choose a file</span>
        <input id="file" type="file" />
      </label>
      <label class="overwrite"><input id="overwrite" type="checkbox" /> Overwrite a file with the same name</label>
      <button id="upload" class="btn btn-primary" type="button" disabled>Upload</button>
      <p id="status" class="status-line status" role="status" aria-live="polite"></p>
      <div class="rules">
        <strong>Safety limits</strong>
        <span>Agents see <code>/warehouse</code> read-only.</span>
        <span>Nothing here can delete a file.</span>
        <span>Replacing an existing file needs the checkbox and a second press.</span>
      </div>
    </aside>
  </main>

  <script type="module" src="/static/js/warehouse.mjs"></script>
</body>
</html>
