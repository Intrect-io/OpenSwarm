<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenSwarm Repository Threads</title>
  <style>
    :root { --bg:#0b0e14; --panel:#11151d; --border:#252c3a; --text:#e6e9ef; --dim:#778094; --cyan:#3b9eff; --green:#4cc38a; --red:#e5484d; --amber:#e8b339; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:13px/1.5 "SF Mono",ui-monospace,Menlo,monospace; min-height:100vh; }
    header { display:flex; gap:16px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--border); }
    h1 { margin:0; font-size:14px; letter-spacing:1px; }
    a { color:var(--dim); text-decoration:none; font-size:11px; }
    a:hover { color:var(--cyan); }
    #repo { margin-left:auto; min-width:280px; }
    select,input,textarea,button { color:var(--text); background:#0d1117; border:1px solid var(--border); border-radius:5px; font:inherit; }
    select,input,textarea { padding:7px 8px; }
    button { padding:7px 11px; cursor:pointer; }
    button.primary { color:#081018; background:var(--cyan); border-color:var(--cyan); font-weight:700; }
    button.danger { color:var(--red); }
    button:disabled { cursor:default; opacity:.45; }
    #status { min-height:27px; padding:5px 18px; color:var(--dim); border-bottom:1px solid var(--border); }
    #status.error { color:var(--red); }
    main { display:grid; grid-template-columns:minmax(280px,36%) 1fr; height:calc(100vh - 81px); }
    aside { border-right:1px solid var(--border); min-width:0; display:flex; flex-direction:column; }
    .toolbar { display:flex; gap:7px; padding:10px; border-bottom:1px solid var(--border); }
    .toolbar select { flex:1; }
    #threads { overflow:auto; flex:1; }
    .thread-card { width:100%; text-align:left; border:0; border-bottom:1px solid var(--border); border-radius:0; padding:11px 12px; background:transparent; }
    .thread-card:hover,.thread-card.selected { background:#141a24; }
    .thread-card.selected { box-shadow:inset 3px 0 var(--cyan); }
    .subject { display:flex; gap:7px; align-items:center; font-weight:700; }
    .badge { color:var(--dim); border:1px solid var(--border); border-radius:3px; padding:0 4px; font-size:9px; }
    .badge.open { color:var(--green); }
    .badge.resolved { color:var(--dim); }
    .meta { margin-top:4px; color:var(--dim); font-size:10px; overflow-wrap:anywhere; }
    article { min-width:0; display:flex; flex-direction:column; }
    #empty { color:var(--dim); padding:24px; }
    #detail { display:none; min-height:0; flex:1; flex-direction:column; }
    #detail.visible { display:flex; }
    .detail-head { padding:14px 16px; border-bottom:1px solid var(--border); }
    .detail-head h2 { margin:0 0 5px; font-size:16px; }
    .detail-actions { display:flex; gap:7px; margin-top:9px; }
    #messages { flex:1; overflow:auto; padding:10px 16px; }
    .message { padding:9px 10px; margin:7px 0; border:1px solid var(--border); border-radius:6px; background:var(--panel); }
    .message-head { color:var(--dim); font-size:10px; }
    .message-body { margin-top:4px; white-space:pre-wrap; overflow-wrap:anywhere; }
    form { display:grid; gap:8px; }
    #reply-form { grid-template-columns:1fr auto; padding:12px 16px; border-top:1px solid var(--border); }
    #reply-form textarea { min-height:54px; resize:vertical; }
    #new-thread { padding:12px; border-top:1px solid var(--border); }
    #new-thread textarea { min-height:62px; resize:vertical; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .empty { color:var(--dim); padding:16px; }
    @media (max-width:800px) { header { flex-wrap:wrap; } #repo { margin-left:0; width:100%; } main { grid-template-columns:1fr; height:auto; } aside { border-right:0; max-height:50vh; } article { min-height:50vh; } }
  </style>
</head>
<body>
  <header>
    <h1>▦ REPOSITORY THREADS</h1>
    <a href="/orchestration">orchestration</a>
    <a href="/chat">chat</a>
    <select id="repo" aria-label="Repository"><option value="">Select repository…</option></select>
  </header>
  <div id="status" role="status" aria-live="polite">Choose a repository to open its durable board.</div>
  <main>
    <aside>
      <div class="toolbar">
        <select id="thread-status" aria-label="Thread status">
          <option value="open">open threads</option>
          <option value="resolved">resolved threads</option>
          <option value="">all threads</option>
        </select>
        <button id="refresh" type="button">refresh</button>
      </div>
      <div id="threads"><div class="empty">No repository selected.</div></div>
      <form id="new-thread">
        <strong>NEW THREAD</strong>
        <input name="taskId" required placeholder="Related task ID (for example AGT-4131)" />
        <input name="subject" required maxlength="240" placeholder="Subject" />
        <textarea name="body" maxlength="4000" placeholder="Opening evidence or question"></textarea>
        <div class="two">
          <input name="relatedTaskIds" placeholder="More task IDs, comma-separated" />
          <input name="relatedFiles" placeholder="Repository files, comma-separated" />
        </div>
        <button class="primary" type="submit">open thread</button>
      </form>
    </aside>
    <article>
      <div id="empty">Select a thread to read its durable history.</div>
      <section id="detail">
        <div class="detail-head">
          <h2 id="detail-subject"></h2>
          <div id="detail-meta" class="meta"></div>
          <div class="detail-actions">
            <button id="follow" type="button"></button>
            <button id="resolve" class="danger" type="button">resolve at this version</button>
          </div>
        </div>
        <div id="messages"></div>
        <form id="reply-form">
          <textarea name="body" required maxlength="4000" placeholder="Reply with a decision, question, or evidence"></textarea>
          <button class="primary" type="submit">reply</button>
        </form>
      </section>
    </article>
  </main>
  <script type="module">
    import { startThreadBoard } from '/static/js/threadBoard.mjs';
    startThreadBoard(document);
  </script>
</body>
</html>
