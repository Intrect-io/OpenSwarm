<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenSwarm · Repository threads</title>
  <script src="/static/js/themeBoot.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/shell.css" />
  <link rel="stylesheet" href="/static/css/threads.css" />
</head>
<body class="page-threads">
  <header class="topbar">
    <a class="brand" href="/app">🐝 OpenSwarm</a>
    <span class="page-title">Repository threads</span>
    <nav class="topbar-nav" aria-label="Pages">
      <a href="/app">Cockpit</a>
      <a href="/chat">Chat</a>
      <a href="/orchestration">Orchestration</a>
      <a href="/threads" aria-current="page">Threads</a>
      <a href="/warehouse">Warehouse</a>
      <a href="/">Supervisor</a>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <select id="repo" class="select" aria-label="Repository"><option value="">Select repository…</option></select>
      <button type="button" id="theme-toggle" class="btn btn-ghost btn-icon theme-toggle" aria-label="Switch theme" aria-pressed="false">
        <span class="when-dark" aria-hidden="true">☾</span><span class="when-light" aria-hidden="true">☀</span>
      </button>
    </div>
  </header>

  <div id="status" class="status-line threads-status" role="status" aria-live="polite">Loading durable threads across all repositories…</div>

  <main class="threads-main">
    <aside class="threads-list" aria-label="Threads">
      <div class="toolbar">
        <select id="thread-status" class="select" aria-label="Thread status">
          <option value="open">Open threads</option>
          <option value="resolved">Resolved threads</option>
          <option value="">All threads</option>
        </select>
        <button id="refresh" type="button" class="btn btn-secondary">Refresh</button>
      </div>
      <div id="threads"><div class="empty">Loading all repository threads…</div></div>
      <form id="new-thread" class="new-thread" aria-labelledby="new-thread-title">
        <h2 id="new-thread-title">New thread</h2>
        <label class="field">
          <span>Related task</span>
          <input class="input" name="taskId" required placeholder="AGT-4131" />
        </label>
        <label class="field">
          <span>Subject</span>
          <input class="input" name="subject" required maxlength="240" />
        </label>
        <label class="field">
          <span>Opening evidence or question</span>
          <textarea class="textarea" name="body" maxlength="4000" rows="3"></textarea>
        </label>
        <div class="two">
          <label class="field">
            <span>More task IDs</span>
            <input class="input" name="relatedTaskIds" placeholder="Comma-separated" />
          </label>
          <label class="field">
            <span>Repository files</span>
            <input class="input" name="relatedFiles" placeholder="Comma-separated" />
          </label>
        </div>
        <button class="btn btn-primary" type="submit">Open thread</button>
      </form>
    </aside>

    <article class="threads-detail" aria-label="Thread">
      <div id="empty" class="empty">Select a thread to read its durable history.</div>
      <section id="detail">
        <div class="detail-head">
          <h2 id="detail-subject"></h2>
          <div id="detail-meta" class="meta"></div>
          <div class="detail-actions">
            <button id="follow" type="button" class="btn btn-secondary"></button>
            <button id="resolve" type="button" class="btn btn-danger">Resolve thread</button>
          </div>
          <div id="resolve-confirm" class="confirm-card" role="alertdialog" aria-labelledby="resolve-confirm-text" hidden>
            <p id="resolve-confirm-text" class="confirm-text"></p>
            <div class="confirm-actions">
              <button id="resolve-cancel" type="button" class="btn btn-secondary">Keep open</button>
              <button id="resolve-confirm-btn" type="button" class="btn btn-danger">Resolve</button>
            </div>
          </div>
        </div>
        <div id="messages"></div>
        <form id="reply-form" class="reply-form">
          <label class="sr-only" for="reply-body">Reply</label>
          <textarea id="reply-body" class="textarea" name="body" required maxlength="4000" rows="2" placeholder="Reply with a decision, question, or evidence"></textarea>
          <button class="btn btn-primary" type="submit">Reply</button>
        </form>
      </section>
    </article>
  </main>

  <script type="module">
    import { startThreadBoard } from '/static/js/threadBoard.mjs';
    import { installThemeToggle } from '/static/js/theme.mjs';
    installThemeToggle(document, document.getElementById('theme-toggle'));
    startThreadBoard(document);
  </script>
</body>
</html>
