<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>OpenSwarm · Terminal</title>
<script src="/static/js/themeBoot.js"></script><script src="/static/js/webToken.js"></script>
<link rel="stylesheet" href="/static/css/tokens.css"><link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<style>
  .page-terminal main { display: flex; flex-direction: column; height: calc(100dvh - 56px); padding: var(--space-2, 8px); gap: var(--space-2, 8px); box-sizing: border-box; }
  .terminal-bar { display: flex; align-items: center; gap: var(--space-2, 8px); font-size: var(--text-sm, 13px); }
  .terminal-bar .grow { flex: 1; }
  #terminal-state[data-tone="ok"] { color: var(--success, #3fb950); }
  #terminal-state[data-tone="warn"] { color: var(--warning, #d29922); }
  #terminal-state[data-tone="danger"] { color: var(--danger, #f85149); }
  #terminal { flex: 1; min-height: 0; background: #000; border-radius: var(--radius-md, 6px); padding: 4px; }
</style></head>
<body class="page-terminal"><header class="topbar" data-shell></header>
<main>
  <div class="terminal-bar">
    <strong>Container shell</strong>
    <span id="terminal-state" role="status" aria-live="polite">Connecting…</span>
    <span class="grow"></span>
    <button id="terminal-reconnect" class="btn btn-secondary btn-sm" type="button" hidden>Reconnect</button>
  </div>
  <div id="terminal" aria-label="Terminal"></div>
</main>
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/addon-fit.js"></script>
<script src="/static/js/terminal.js"></script>
<script type="module">
  import { mountShell } from '/static/js/shell.mjs';
  mountShell(document);
</script>
</body></html>
