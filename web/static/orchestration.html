<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenSwarm · Orchestration</title>
  <script src="/static/js/themeBoot.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/shell.css" />
  <link rel="stylesheet" href="/static/css/orchestration.css" />
</head>
<body class="page-orchestration">
  <header class="topbar">
    <a class="brand" href="/app">🐝 OpenSwarm</a>
    <span class="page-title">Orchestration</span>
    <nav class="topbar-nav" aria-label="Pages">
      <a href="/app">Cockpit</a>
      <a href="/chat">Chat</a>
      <a href="/orchestration" aria-current="page">Orchestration</a>
      <a href="/threads">Threads</a>
      <a href="/warehouse">Warehouse</a>
      <a href="/">Supervisor</a>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button type="button" id="theme-toggle" class="btn btn-ghost btn-icon theme-toggle" aria-label="Switch theme" aria-pressed="false">
        <span class="when-dark" aria-hidden="true">☾</span><span class="when-light" aria-hidden="true">☀</span>
      </button>
    </div>
  </header>

  <div id="waiting" class="waiting" role="status" aria-live="polite"></div>

  <div class="orch-toolbar">
    <div id="controls" role="group" aria-label="Filter the board">
      <input id="filter-search" class="input" type="search" autocomplete="off" placeholder="Search agents…" aria-label="Search agents" />
      <select id="filter-task" class="select" aria-label="Filter by task" data-options="">
        <option value="">All tasks</option>
      </select>
      <select id="filter-role" class="select" aria-label="Filter by role">
        <option value="">All roles</option>
        <option value="worker">worker</option>
        <option value="reviewer">reviewer</option>
        <option value="orchestrator">orchestrator</option>
        <option value="review-agent">review agent</option>
        <option value="daemon">daemon</option>
        <option value="human">operator</option>
      </select>
      <label for="filter-idle">
        <input id="filter-idle" type="checkbox" /> Show idle <span id="idle-count"></span>
      </label>
    </div>
    <div id="stats" aria-label="Board statistics"></div>
  </div>

  <main class="orch-main">
    <div id="graph-wrap">
      <svg id="graph" role="img" aria-label="Agent interaction graph"></svg>
      <div id="legend" aria-label="Legend"></div>
    </div>
    <aside class="orch-aside" aria-label="Selection details">
      <h2>Agent detail</h2>
      <div id="detail"><div class="empty">Select a node</div></div>
      <h2>Event feed</h2>
      <div id="feed"><div class="empty">Loading…</div></div>
      <h2>Conversation</h2>
      <div id="thread"><div class="empty">Select an event to read its conversation</div></div>
    </aside>
  </main>

  <script type="module">
    import { startOrchestrationView } from '/static/js/orchestrationView.mjs';
    import { installThemeToggle } from '/static/js/theme.mjs';
    installThemeToggle(document, document.getElementById('theme-toggle'));
    startOrchestrationView(document);
  </script>
</body>
</html>
