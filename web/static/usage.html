<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenSwarm · Usage</title>
  <script src="/static/js/themeBoot.js"></script>
  <script src="/static/js/webToken.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/shell.css" />
  <link rel="stylesheet" href="/static/css/usage.css" />
</head>
<body class="page-usage">
  <header class="topbar" data-shell>
    <div class="topbar-actions">
      <label class="sr-only" for="window">Time window</label>
      <select id="window" class="select">
        <option value="1h">Last hour</option>
        <option value="2h">Last 2 hours</option>
        <option value="6h">Last 6 hours</option>
        <option value="24h" selected>Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
      </select>
      <button type="button" id="refresh" class="btn btn-secondary btn-sm">Refresh</button>
    </div>
  </header>

  <main class="usage-main">
    <p id="status" class="status-line status" role="status" aria-live="polite">Loading…</p>

    <section class="summary" aria-label="Summary">
      <div class="card stat"><span class="stat-label">Cost</span><strong id="sum-cost" class="stat-value">—</strong><span id="sum-cost-note" class="stat-note"></span></div>
      <div class="card stat"><span class="stat-label">Calls</span><strong id="sum-calls" class="stat-value">—</strong><span id="sum-calls-note" class="stat-note"></span></div>
      <div class="card stat"><span class="stat-label">Tokens</span><strong id="sum-tokens" class="stat-value">—</strong><span id="sum-tokens-note" class="stat-note"></span></div>
      <div class="card stat"><span class="stat-label" title="Share of prompt tokens served from the provider's cache">Cache hit rate</span><strong id="sum-cache" class="stat-value">—</strong><span class="stat-note">cached / prompt</span></div>
    </section>

    <!-- One empty state for the whole window, instead of six panels each
         repeating "no usage". Shown by usage.mjs when the window has no calls. -->
    <section id="usage-empty" class="usage-empty-window" hidden>
      <h2>No usage in this window</h2>
      <p>Every model call the daemon makes is recorded here with its cost and tokens. Pick a longer window, or start a run and refresh.</p>
    </section>

    <div id="usage-breakdown" class="usage-breakdown">
    <section class="card panel" aria-labelledby="days-title">
      <h2 id="days-title" class="card-head">By day</h2>
      <div class="card-body"><div id="days" class="bars"></div></div>
    </section>

    <div class="grid">
      <section class="card panel" aria-labelledby="model-title">
        <h2 id="model-title" class="card-head">By model</h2>
        <p id="note-model" class="muted task-note"></p>
        <div class="card-body table-wrap"><table id="table-model"></table></div>
      </section>
      <section class="card panel" aria-labelledby="stage-title">
        <h2 id="stage-title" class="card-head">By stage</h2>
        <p id="note-stage" class="muted task-note"></p>
        <div class="card-body table-wrap"><table id="table-stage"></table></div>
      </section>
      <section class="card panel" aria-labelledby="adapter-title">
        <h2 id="adapter-title" class="card-head">By adapter</h2>
        <p id="note-adapter" class="muted task-note"></p>
        <div class="card-body table-wrap"><table id="table-adapter"></table></div>
      </section>
      <section class="card panel" aria-labelledby="project-title">
        <h2 id="project-title" class="card-head">By project</h2>
        <p id="note-project" class="muted task-note"></p>
        <div class="card-body table-wrap"><table id="table-project"></table></div>
      </section>
    </div>

    <section class="card panel" aria-labelledby="tasks-title">
      <h2 id="tasks-title" class="card-head">By task, most calls first</h2>
      <p id="task-note" class="muted task-note"></p>
      <div class="card-body table-wrap"><table id="table-task"></table></div>
    </section>
    </div>

  </main>

  <script type="module">
    import { mountShell } from '/static/js/shell.mjs';
    mountShell(document);
  </script>
  <script type="module" src="/static/js/usage.mjs"></script>
</body>
</html>
