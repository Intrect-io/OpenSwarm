# OpenSwarm Configuration
# Environment variables can be used in ${VAR_NAME} or ${VAR_NAME:-default} format
# Copy this file to config.yaml to use

# Default CLI adapter for worker/reviewer stages
# Options: codex, codex-responses, cc-router, cursor, gpt, local, lmstudio, openrouter, atlascloud, claude
# For ChatGPT OAuth: run `openswarm auth login --provider gpt`
#   `codex-responses` runs OpenSwarm's native tool loop with the same login.
# For OpenRouter: run `openswarm auth login --provider openrouter`
#   (PKCE browser flow → stores a sk-or-* API key; falls back to manual paste)
# For Atlas Cloud: set ATLASCLOUD_API_KEY
# For local: start Ollama, LMStudio, or llama.cpp server
# For lmstudio: start LM Studio Local Server (default http://localhost:1234)
#   Optional env: LMSTUDIO_BASE_URL, LMSTUDIO_MODEL, LMSTUDIO_API_KEY
#   If LMSTUDIO_MODEL is unset, the adapter auto-selects the first loaded model.
# web_search: set OPENSWARM_SEARXNG_URL (vega-search, e.g. http://searxng:8080)
#   or VEGA_SEARXNG_URL. Optional OPENSWARM_SEARXNG_KEY / VEGA_SEARXNG_KEY for
#   the public X-VEGA-Key header. TAVILY_KEY / BRAVE_SEARCH_KEY still work.
adapter: codex-responses

discord:
  token: ${DISCORD_TOKEN}
  channelId: ${DISCORD_CHANNEL_ID}
  webhookUrl: ${DISCORD_WEBHOOK_URL:-}  # Optional

# Optional fail-closed boundary for unattended agents. When enabled, all
# external human collaboration surfaces are read-only. Delegated CLIs and
# diagnostics stay disabled. Native-loop bash is exposed only after the
# separate network-none companion attests its Unix socket, bwrap mount/PID
# namespaces, exact /work roots and limits. Missing/mismatched proof leaves it
# disabled; typed DevOps/data MCP writes keep their existing grants.
humanSurfaceReadOnly:
  enabled: false
  sandboxExecutor:
    enabled: false
    socketPath: /run/openswarm-sandbox/executor.sock
    allowedRoots: [/work]
    connectTimeoutMs: 1000
    maxRequestBytes: 65536
    maxOutputBytes: 524288
    maxTimeoutMs: 900000
    maxConcurrent: 8

linear:
  apiKey: ${LINEAR_API_KEY}
  teamId: ${LINEAR_TEAM_ID}

github:
  repos:
    - owner/repo  # owner/repo format
  checkInterval: 300000  # 5 minutes (ms)

# Agent list
agents:
  - name: main
    projectPath: ~/dev/your-project
    heartbeatInterval: 1800000  # 30 minutes (ms)
    linearLabel: main  # Label for Linear issue filtering
    enabled: true
    paused: false

# Default heartbeat interval (ms)
defaultHeartbeatInterval: 1800000  # 30 minutes

# Autonomous execution mode settings
autonomous:
  enabled: true
  pairMode: true
  schedule: "*/15 * * * *"  # Every 15 minutes
  maxAttempts: 3
  maxConcurrentTasks: 64  # Operator-controlled global capacity (maximum 256)
  # In Progress is a live ownership signal, not a parking lot. If neither the
  # scheduler nor a durable lease owns an issue for this long, return it to Backlog.
  stalledInProgressHours: 6
  worktreeMode: true  # Required for same-project parallel tasks
  allowSameProjectConcurrent: true
  # maxConcurrentPerProject: 64  # Optional hard cap; omit for weighted, work-conserving project fairness
  automationLedgerMode: primary  # off | shadow | primary (durable fail-closed execution truth)
  automationLeaseMs: 600000      # Renewed every ~3m; stale callbacks are fenced
  shutdownGraceMs: 30000         # Wait for real executor exit before service teardown

  # Durable agent board + human/operator coordination. Use one project-scoped
  # issue whose comments form the append-only Linear board.
  coordinationBoardIssueId: AGT-3993

  # `primary` must name the same adapter this file selects above (adapter:), or
  # routing silently disables — the worker only consults a policy whose primary
  # is the adapter it is actually running.
  # Only typed failures may route to CC-Router or an authenticated Cursor CLI;
  # a failing test or a reviewer verdict never does.
  #   quota      — provider usage limit / 429 on the primary
  #   infra      — spawn, auth, or timeout failure before the agent ran
  #   capability — the primary is not installed or not serving on this machine
  adapterRouting:
    primary: codex-responses
    fallbacks: [cc-router, cursor]
    allowReasons: [quota, infra, capability]

  # Exact role-scoped MCP grants. Reads are allowed from listed servers; writes
  # and destructive operations require exact tool names.
  mcpPolicies:
    orchestrator:
      servers: [github, linear, cloudflare]
      writeTools: [linear__save_comment]
    worker:
      servers: [github, linear]
      writeTools: [linear__save_comment]
    reviewer:
      servers: [github, linear]

  # Periodic review agents are read-only and leased per repository/profile.
  periodicReviews:
    - { profile: permissions, schedule: "17 */6 * * *" }
    - { profile: hygiene, schedule: "43 */6 * * *" }
    - { profile: security, schedule: "11 2 * * *", adapter: codex }

  # High-capability project supervisor. Actionable board requests trigger a
  # debounced sweep immediately; the cron is a reconciliation fallback. It runs
  # in a scratch directory with shell access withheld, so use a native-loop
  # adapter (delegated codex/claude/cursor CLIs are rejected).
  orchestrator:
    enabled: true
    schedule: "17 */2 * * *"
    eventDriven: true
    eventDebounceMs: 1000
    adapter: codex-responses
    model: gpt-5.6-sol
    reasoningEffort: high
    timeoutMs: 600000
    maxTurns: 12

  allowedProjects:
    - ~/dev/your-project

  # Task decomposition settings (Planner Agent)
  decomposition:
    enabled: true                    # Enable decomposition
    thresholdMinutes: 30             # Decompose if estimated time exceeds this
    plannerModel: gpt-5.6-sol         # High-leverage decomposition stays on Sol

  # Backlog grooming (Planner compares fetched open queue states against the repo).
  # Safe default: comment recommendations only. Set mode: apply to update
  # descriptions and move strongly stale issues to Done.
  backlogGrooming:
    enabled: false
    cadenceHours: 24
    mode: comment
    plannerModel: gpt-5.6-terra       # Bulk queue analysis favors the balanced tier
    maxIssues: 80

  # Per-role settings
  # GPT-5.6: Luna=high-volume/light, Terra=balanced default, Sol=quality gate.
  defaultRoles:
    worker:
      enabled: true
      model: gpt-5.6-terra             # Default implementation tier
      escalateModel: gpt-5.6-sol       # Repeated failure earns the frontier tier
      escalateAfterIteration: 2
      timeoutMs: 1800000  # 30 minutes
    reviewer:
      enabled: true
      model: gpt-5.6-sol               # Correctness gate; light profile lowers this to Terra
      timeoutMs: 600000
    tester:
      enabled: false
      model: gpt-5.6-terra             # Used only if deterministic verify cannot run
    documenter:
      enabled: false
      model: gpt-5.6-luna
      timeoutMs: 120000   # 2 minutes
    auditor:
      enabled: false
      model: gpt-5.6-sol
      timeoutMs: 300000   # 5 minutes
    skill-documenter:
      enabled: false
      model: gpt-5.6-luna
      timeoutMs: 120000   # 2 minutes

  # Deterministic baseline-diff verification (enabled by default).
  # Define repo-specific commands in .openswarm/verify.yaml; see templates/verify.example.yaml.
  verify:
    enabled: true
    blockOnNewFailures: true
    maxCommands: 4

  # CodeQL security baseline-diff gate. This also applies to PR auto-remediation.
  # CodeQL must be preinstalled on an absolute PATH; tool absence blocks an edit.
  securityAudit:
    enabled: true
    maxThreads: 2
    # Memory target passed to each CodeQL run, in MB. Best-effort by CodeQL's
    # own account — a large database can still exceed it.
    maxRamMb: 4096
    # How many CodeQL runs may execute at once is a PROCESS-wide bound, not a
    # per-audit setting, so it lives in the environment rather than here:
    # OPENSWARM_CODEQL_MAX_CONCURRENT (default 1, max 8). Raise it only on a
    # host with cores to spare — the audit runs twice per task, and letting it
    # scale with maxConcurrentTasks is what starved the daemon (AGT-4062).

  # Pipeline guards
  guards:
    qualityGate: false      # deprecated whole-tree gate; prefer verify above
    fakeDataGuard: true
    conventionalCommits: true
    branchValidation: true
    uncertaintyDetection: true
    registryCheck: true
    bsDetector: true        # blocks on critical code-smell patterns
    dependencyAntiPatternCheck: true  # block package recreation/version spoofing after import failures (INT-2388 #1)
    contractEvidenceCheck: true       # block self-referential contract tests without producer/consumer evidence (INT-2388 #2)
    verifiedMetricEvidenceCheck: true # block verified evidence deletion / metric changes without distributions (INT-2388 #4)
    deadModuleCheck: true   # warn on new modules nothing imports/calls (INT-2388 #5)
    reformatCheck: true     # warn on reformat-only files / oversized diffs (INT-2388 #6)

  # Self-repair reflection budget: max objective (lint/bs/test) failures tolerated
  # before the loop gives up on bad edits. Lower it to cap token burn when
  # reflection stops making progress; the loop also bails early on stagnation
  # (identical errors twice in a row). Default: 3.
  maxReflections: 3

  # Job profiles override the default Worker/Reviewer pair by task estimate.
  jobProfiles:
    - name: light
      minMinutes: 1
      maxMinutes: 29
      effort: low
      roles:
        worker: gpt-5.6-luna
        reviewer: gpt-5.6-terra
    - name: heavy
      minMinutes: 30
      effort: high
      roles:
        worker: gpt-5.6-terra
        reviewer: gpt-5.6-sol

# Long-running task monitoring (RunPod training, batch processing, etc.)
#
# checkCommand is a literal argv array — no shell is invoked, so pipes,
# redirects, and substitutions do not work. Put shell logic in a script
# you control and call that script instead (e.g. ["/opt/probe.sh", "arg"]).
#
# monitors:
#   - id: runpod-training
#     name: "LSTM model training"
#     issueId: INT-456
#     checkCommand: ["ssh", "runpod", "tail -1 /workspace/train.log"]
#     completionCheck:
#       type: output-regex
#       successPattern: "Training finished"
#       failurePattern: "Error|FAILED"
#     checkInterval: 2         # Every 2 heartbeats
#     maxDurationHours: 24
#     notify: true

# PR Auto-Improvement
prProcessor:
  enabled: true
  schedule: "*/15 * * * *"    # Check every 15 minutes
  maxIterations: 3            # Max 3 Worker-Reviewer iterations

# Anonymous usage telemetry (opt-out). Sends command name, version, and OS only —
# never code, prompts, paths, or personal data. Disable here, or via
# OPENSWARM_TELEMETRY=0 / DO_NOT_TRACK=1. CI environments are excluded automatically.
telemetry:
  enabled: true

# MCP servers available to the daemon. Role policies below decide which tools
# each autonomous role actually sees; no policy means no MCP access.
mcp:
  servers:
    github:
      surface: devops
      command: npx
      args: ["-y", "@modelcontextprotocol/server-github"]
    linear:
      surface: devops
      preset: linear
    cloudflare:
      surface: devops
      command: npx
      args: ["-y", "@cloudflare/mcp-server-cloudflare"]
    # Label opaque aliases explicitly. Human-surface tools remain globally
    # read-only even when a role lists them in writeTools/destructiveTools.
    # company-comms:
    #   surface: human
    #   url: https://mcp.example.com/comms
