name: Standalone bundles

# Builds the self-contained OpenSwarm bundle (scripts/build-standalone.sh) on
# each supported platform, proves it with scripts/smoke-standalone.sh, and
# keeps the tarball as a workflow artifact.
#
# This workflow only builds and tests. It creates no tag, no GitHub Release
# and no package; it has read-only repository access. A release workflow that
# wants the bundles calls this one (workflow_call) and attaches the artifacts
# itself.
#
# Bundles contain native modules (better-sqlite3, @lancedb/lancedb,
# onnxruntime-node) built for one OS and CPU, so each platform is built on a
# runner of that platform; nothing is cross-built.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-standalone.sh'
      - 'scripts/smoke-standalone.sh'
      - 'scripts/deploy-standalone.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/standalone.yml'
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: 'Package version the bundles were built from'
        value: ${{ jobs.bundle.outputs.version }}

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Standalone bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) so the bundle also runs on older distros
          # than the build host.
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      # Host Node only compiles TypeScript and runs `npm pack`; the bundle
      # ships its own pinned runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache the pinned Node.js archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/openswarm-standalone
          key: standalone-node-${{ matrix.platform }}-${{ hashFiles('scripts/build-standalone.sh') }}

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build the bundle
        run: bash scripts/build-standalone.sh --tarball

      - name: Check the platform
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          name="openswarm-${version}-${{ matrix.platform }}"
          test -x "dist-standalone/${name}/bin/openswarm"
          test -f "dist-standalone/${name}.tar.gz"
          test -f "dist-standalone/${name}.tar.gz.sha256"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the bundle as extracted from its tarball
        run: |
          mkdir -p dist-standalone/extracted
          tar -xzf "dist-standalone/${{ steps.meta.outputs.name }}.tar.gz" -C dist-standalone/extracted
          bash scripts/smoke-standalone.sh "dist-standalone/extracted/${{ steps.meta.outputs.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            dist-standalone/${{ steps.meta.outputs.name }}.tar.gz
            dist-standalone/${{ steps.meta.outputs.name }}.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
