[package]
name = "openswarm-desktop"
version = "0.1.0"
description = "OpenSwarm desktop shell — a thin Tauri client for the local OpenSwarm daemon"
authors = ["unohee"]
edition = "2021"
rust-version = "1.77"
default-run = "openswarm-desktop"

[lib]
name = "openswarm_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# Clipboard fallback — navigator.clipboard is blocked on the remote-origin WebView
# (http://127.0.0.1:3847), same trap as vega INT-1472.
tauri-plugin-clipboard-manager = "2"
# A second shell instance must not race the first one for the tray/main window.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
fs2 = "0.4"
atomicwrites = "0.4"

[target."cfg(target_os = \"macos\")".dependencies]
# getuid for the launchctl gui/<uid> domain — macOS only.
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
